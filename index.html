<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator Tycoon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
:root{
  --bg:#f4f5fb; --card:#ffffff; --text:#1c1d2b; --muted:#6b6e85; --line:#e3e5f0;
  --accent:#e5384f; --accent2:#ff7a59; --money:#1f9d55; --subs:#3b6cf6;
  --gold:#e0a400; --disabled:#c9ccd9; --shadow:0 2px 10px rgba(20,20,60,.07);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12131c; --card:#1c1e2b; --text:#ecedf5; --muted:#9a9db5; --line:#2c2f42;
    --money:#3fd67f; --subs:#7c9dff; --disabled:#3a3d52; --shadow:0 2px 12px rgba(0,0,0,.35); }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:1.5rem;margin:0}
h1 span{color:var(--accent)}
.small-btn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem}
.small-btn:hover{color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .label{color:var(--muted);font-size:.85rem}
.stat .val{font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .rate{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.money .val{color:var(--money)} .subs .val{color:var(--subs)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:1.05rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.record{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
#recBtn{width:170px;height:170px;border-radius:50%;border:none;cursor:pointer;color:#fff;font-size:1.1rem;font-weight:700;
  background:radial-gradient(circle at 35% 30%,var(--accent2),var(--accent));box-shadow:0 8px 24px rgba(229,56,79,.4);transition:transform .06s;user-select:none}
#recBtn:active{transform:scale(.94)}
#recBtn .icon{font-size:2.6rem;display:block}
.clickinfo{color:var(--muted);font-size:.9rem;text-align:center}
.float{position:absolute;pointer-events:none;font-weight:700;animation:up 1s ease-out forwards;white-space:nowrap}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.item .emoji{font-size:1.6rem;width:36px;text-align:center}
.item .info{flex:1;min-width:0}
.item .name{font-weight:600}
.item .desc{color:var(--muted);font-size:.8rem}
.item button{min-width:96px;border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:600;background:var(--money);color:#fff;font-variant-numeric:tabular-nums}
.item button:disabled{background:var(--disabled);cursor:not-allowed;color:var(--muted)}
.item.locked{opacity:.45}
.lvl{color:var(--muted);font-size:.8rem;font-weight:500}
.buyamt{display:flex;gap:4px}
.buyamt button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:.8rem}
.buyamt button.on{background:var(--text);color:var(--card);border-color:var(--text)}
.awards{display:flex;flex-wrap:wrap;gap:8px}
.award{flex:1 1 140px;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;opacity:.4}
.award.got{opacity:1;border-color:var(--gold)}
.award .e{font-size:1.8rem}
.award .t{font-weight:600;font-size:.9rem}
.award .d{color:var(--muted);font-size:.75rem}
#sponsor{position:fixed;z-index:5;border:none;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;
  background:var(--gold);color:#1c1d2b;box-shadow:0 6px 20px rgba(224,164,0,.5);animation:bob 1.2s ease-in-out infinite;display:none}
@keyframes bob{50%{transform:translateY(-6px)}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 16px;border-radius:10px;
  font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:6}
#toast.show{opacity:1}
.boost{color:var(--gold);font-weight:700;font-size:.9rem;min-height:1.2em;text-align:center}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin:18px 0 6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎬 Creator <span>Tycoon</span></h1>
    <div style="display:flex;gap:6px">
      <button class="small-btn" id="saveBtn">💾 Speichern</button>
      <button class="small-btn" id="resetBtn">🗑️ Neustart</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat money"><div class="label">💰 Geld</div><div class="val" id="money">0 €</div><div class="rate" id="moneyRate">+0 €/s</div></div>
    <div class="stat subs"><div class="label">👥 Abonnenten</div><div class="val" id="subs">0</div><div class="rate" id="subsRate">+0 /s</div></div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Studio <span class="lvl" id="videos">0 Videos</span></h2>
        <div class="record" id="recordArea">
          <button id="recBtn"><span class="icon">⏺️</span>Video aufnehmen</button>
          <div class="boost" id="boost"></div>
          <div class="clickinfo" id="clickInfo"></div>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>🛠️ Ausrüstung <span class="lvl">mehr pro Video</span></h2>
        <div id="upgrades"></div>
      </div>
    </div>
    <div>
      <div class="card">
        <h2>🧑‍💼 Team <span class="buyamt" id="buyAmt"><button data-n="1" class="on">x1</button><button data-n="10">x10</button><button data-n="max">Max</button></span></h2>
        <div id="workers"></div>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>🏆 Awards <span class="lvl" id="awardBonus"></span></h2>
        <div class="awards" id="awards"></div>
      </div>
    </div>
  </div>
  <footer>Abonnenten erhöhen alle Einnahmen · Spielstand wird automatisch gespeichert</footer>
</div>
<button id="sponsor">🤝 Sponsor-Deal!</button>
<div id="toast"></div>

<script>
const UPGRADES = [
  {id:'cam',  e:'📷', name:'Bessere Kamera',  add:1,     base:15},
  {id:'mic',  e:'🎙️', name:'Mikrofon',        add:6,     base:150},
  {id:'light',e:'💡', name:'Ringlicht',       add:35,    base:1800},
  {id:'pc',   e:'🖥️', name:'Gaming-PC',       add:200,   base:25000},
  {id:'green',e:'🟩', name:'Greenscreen',     add:1200,  base:350000},
  {id:'studio',e:'🏢',name:'Eigenes Studio',  add:8000,  base:5e6},
];
const WORKERS = [
  {id:'cut',   e:'✂️', name:'Cutter',              rate:0.5,  base:25},
  {id:'thumb', e:'🖼️', name:'Thumbnail-Designer',  rate:4,    base:300},
  {id:'social',e:'📱', name:'Social-Media-Manager',rate:25,   base:3500},
  {id:'camop', e:'🎥', name:'Kamerateam',          rate:150,  base:45000},
  {id:'agency',e:'📈', name:'Marketing-Agentur',   rate:1000, base:600000},
  {id:'empire',e:'🌍', name:'Medien-Imperium',     rate:8000, base:9e6},
  {id:'ai',    e:'🤖', name:'KI-Content-Fabrik',   rate:70000,base:1.5e8},
];
const AWARDS = [
  {subs:100,   e:'🌱', name:'Erste Fans'},
  {subs:1000,  e:'🎉', name:'1.000 Abos'},
  {subs:10000, e:'⭐', name:'Aufsteiger'},
  {subs:100000,e:'🥈', name:'Silber-Award'},
  {subs:1e6,   e:'🥇', name:'Gold-Award'},
  {subs:1e7,   e:'💎', name:'Diamant-Award'},
  {subs:5e7,   e:'❤️‍🔥', name:'Rubin-Award'},
  {subs:1e8,   e:'👑', name:'Legende'},
];
const AWARD_BONUS = 0.25, UP_GROWTH = 1.5, W_GROWTH = 1.15, SAVE_KEY = 'creatorTycoonSave_v1';

let S = fresh();
let buyN = 1, boostUntil = 0;

function fresh(){ return {money:0, subs:0, videos:0, up:{}, w:{}, awards:[], last:Date.now()}; }

// ---------- formulas ----------
const subMult   = () => 1 + Math.sqrt(S.subs) / 40;
const awardMult = () => 1 + S.awards.length * AWARD_BONUS;
const boostMult = () => Date.now() < boostUntil ? 3 : 1;
const totalMult = () => subMult() * awardMult() * boostMult();
const clickBase = () => 1 + UPGRADES.reduce((s,u)=>s + (S.up[u.id]||0)*u.add, 0);
const viewsPerSec = () => WORKERS.reduce((s,w)=>s + (S.w[w.id]||0)*w.rate, 0);
const moneyPerSec = () => viewsPerSec() * totalMult();
const subsPerSec  = () => viewsPerSec() * 0.4;
const clickMoney  = () => clickBase() * totalMult();
const clickSubs   = () => Math.max(1, clickBase() * 0.5);
const upCost = u => Math.ceil(u.base * Math.pow(UP_GROWTH, S.up[u.id]||0));
function wCost(w, n){ const k = S.w[w.id]||0, r = W_GROWTH; return Math.ceil(w.base * Math.pow(r,k) * (Math.pow(r,n)-1)/(r-1)); }
function wMax(w){ const k = S.w[w.id]||0, r = W_GROWTH; const n = Math.floor(Math.log(S.money*(r-1)/(w.base*Math.pow(r,k)) + 1)/Math.log(r)); return Math.max(0,n); }

// ---------- formatting ----------
function fmt(n){
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1).replace('.',',') : Math.floor(n).toLocaleString('de-DE');
  const units = [[1e15,'Brd.'],[1e12,'Bio.'],[1e9,'Mrd.'],[1e6,'Mio.'],[1e3,'Tsd.']];
  for (const [v,s] of units) if (n >= v) return (n/v).toLocaleString('de-DE',{maximumFractionDigits:2}) + ' ' + s;
}
const eur = n => fmt(n) + ' €';

// ---------- render ----------
const $ = id => document.getElementById(id);
function buildLists(){
  $('upgrades').innerHTML = UPGRADES.map(u=>`
    <div class="item" id="u-${u.id}"><div class="emoji">${u.e}</div>
      <div class="info"><div class="name">${u.name} <span class="lvl" id="ul-${u.id}"></span></div>
      <div class="desc">+${fmt(u.add)} Basiswert pro Video</div></div>
      <button data-up="${u.id}"></button></div>`).join('');
  $('workers').innerHTML = WORKERS.map(w=>`
    <div class="item" id="w-${w.id}"><div class="emoji">${w.e}</div>
      <div class="info"><div class="name">${w.name} <span class="lvl" id="wl-${w.id}"></span></div>
      <div class="desc">${fmt(w.rate)} Aufrufe/s je Person</div></div>
      <button data-w="${w.id}"></button></div>`).join('');
  $('awards').innerHTML = AWARDS.map((a,i)=>`
    <div class="award" id="a-${i}"><div class="e">${a.e}</div><div class="t">${a.name}</div><div class="d">${fmt(a.subs)} Abos · +25 %</div></div>`).join('');
}
function render(){
  $('money').textContent = eur(S.money);
  $('subs').textContent = fmt(S.subs);
  $('moneyRate').textContent = '+' + eur(moneyPerSec()) + '/s';
  $('subsRate').textContent = '+' + fmt(subsPerSec()) + ' Abos/s';
  $('videos').textContent = fmt(S.videos) + ' Videos';
  $('clickInfo').textContent = `Pro Video: +${eur(clickMoney())} · +${fmt(clickSubs())} Abos · Abo-Bonus x${subMult().toFixed(2).replace('.',',')}`;
  const left = boostUntil - Date.now();
  $('boost').textContent = left > 0 ? `🤝 Sponsor-Boost: x3 Einnahmen (${Math.ceil(left/1000)}s)` : '';
  let prevOwned = true;
  for (const u of UPGRADES){
    const c = upCost(u), b = document.querySelector(`[data-up="${u.id}"]`);
    b.textContent = eur(c); b.disabled = S.money < c;
    $('ul-'+u.id).textContent = 'Lv. ' + (S.up[u.id]||0);
    $('u-'+u.id).classList.toggle('locked', !prevOwned && S.money < c);
    prevOwned = (S.up[u.id]||0) > 0;
  }
  prevOwned = true;
  for (const w of WORKERS){
    let n = buyN === 'max' ? Math.max(1, wMax(w)) : buyN;
    const c = wCost(w, n), b = document.querySelector(`[data-w="${w.id}"]`);
    b.textContent = (n>1?`${n}x · `:'') + eur(c); b.disabled = S.money < c;
    $('wl-'+w.id).textContent = '× ' + (S.w[w.id]||0);
    $('w-'+w.id).classList.toggle('locked', !prevOwned && S.money < c);
    prevOwned = (S.w[w.id]||0) > 0;
  }
  AWARDS.forEach((a,i)=>$('a-'+i).classList.toggle('got', S.awards.includes(i)));
  $('awardBonus').textContent = S.awards.length ? `+${S.awards.length*25} % Einnahmen` : '';
}

// ---------- actions ----------
function floatText(txt, color, x, y){
  const el = document.createElement('div');
  el.className = 'float'; el.textContent = txt; el.style.color = color;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  $('recordArea').appendChild(el); setTimeout(()=>el.remove(), 1000);
}
$('recBtn').addEventListener('click', e=>{
  let m = clickMoney(), s = clickSubs();
  const viral = Math.random() < 0.02;
  if (viral){ m *= 10; s *= 10; toast('🔥 Dein Video ist viral gegangen! x10'); }
  S.money += m; S.subs += s; S.videos++;
  const r = $('recordArea').getBoundingClientRect();
  const x = (e.clientX ? e.clientX - r.left : r.width/2) - 30 + Math.random()*40;
  const y = (e.clientY ? e.clientY - r.top : 80) - 20;
  floatText('+' + eur(m), 'var(--money)', x, y);
  floatText('+' + fmt(s) + ' 👥', 'var(--subs)', x + 10, y + 22);
  checkAwards(); render();
});
document.addEventListener('click', e=>{
  const up = e.target.closest('[data-up]'), wk = e.target.closest('[data-w]'), amt = e.target.closest('[data-n]');
  if (up){ const u = UPGRADES.find(x=>x.id===up.dataset.up), c = upCost(u);
    if (S.money >= c){ S.money -= c; S.up[u.id] = (S.up[u.id]||0)+1; render(); } }
  if (wk){ const w = WORKERS.find(x=>x.id===wk.dataset.w);
    const n = buyN === 'max' ? wMax(w) : buyN; const c = wCost(w, n);
    if (n > 0 && S.money >= c){ S.money -= c; S.w[w.id] = (S.w[w.id]||0)+n; render(); } }
  if (amt){ buyN = amt.dataset.n === 'max' ? 'max' : +amt.dataset.n;
    document.querySelectorAll('#buyAmt button').forEach(b=>b.classList.toggle('on', b===amt)); render(); }
});
function checkAwards(){
  AWARDS.forEach((a,i)=>{ if (S.subs >= a.subs && !S.awards.includes(i)){ S.awards.push(i); toast(`${a.e} ${a.name} freigeschaltet! +25 % Einnahmen`); } });
}

// ---------- sponsor event ----------
function scheduleSponsor(){ setTimeout(showSponsor, 45000 + Math.random()*75000); }
function showSponsor(){
  const b = $('sponsor');
  b.style.left = (10 + Math.random()*70) + 'vw'; b.style.top = (20 + Math.random()*60) + 'vh';
  b.style.display = 'block';
  const hide = setTimeout(()=>{ b.style.display='none'; scheduleSponsor(); }, 10000);
  b.onclick = ()=>{
    clearTimeout(hide); b.style.display = 'none';
    const bonus = Math.max(moneyPerSec()*60, clickMoney()*30, 50);
    S.money += bonus; boostUntil = Date.now() + 30000;
    toast(`🤝 Sponsor zahlt ${eur(bonus)} + 30 s lang x3 Einnahmen!`);
    render(); scheduleSponsor();
  };
}

// ---------- toast ----------
let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 3000); }

// ---------- save / load ----------
function save(){ S.last = Date.now(); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const d = JSON.parse(localStorage.getItem(SAVE_KEY)); if (d) S = Object.assign(fresh(), d); }catch(e){}
  const away = Math.min((Date.now() - S.last)/1000, 8*3600);
  if (away > 60 && viewsPerSec() > 0){
    const m = moneyPerSec()*away*0.5, s = subsPerSec()*away*0.5;
    S.money += m; S.subs += s; checkAwards();
    setTimeout(()=>toast(`😴 Während du weg warst: +${eur(m)} und +${fmt(s)} Abos`), 400);
  }
}
$('saveBtn').onclick = ()=>{ save(); toast('💾 Gespeichert!'); };
$('resetBtn').onclick = ()=>{ if (confirm('Wirklich alles zurücksetzen?')){ S = fresh(); save(); render(); } };
window.addEventListener('beforeunload', save);

// ---------- loop ----------
let lastTick = performance.now();
function tick(now){
  const dt = Math.min((now - lastTick)/1000, 1); lastTick = now;
  S.money += moneyPerSec()*dt; S.subs += subsPerSec()*dt;
  requestAnimationFrame(tick);
}
buildLists(); load(); render();
requestAnimationFrame(tick);
setInterval(()=>{ checkAwards(); render(); }, 200);
setInterval(save, 10000);
scheduleSponsor();
</script>
</body>
</html>
