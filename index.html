<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kanalbucht</title>
<meta name="description" content="Kanalbucht: eine 3D-Insel zum Herumlaufen. Mach Videos, kauf Häuser und besiege den Boss im Portal.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
<link rel="stylesheet" href="css/welt.css">
</head>
<body>
<canvas id="c" aria-label="3D-Welt Kanalbucht"></canvas>

<div id="hud" hidden>
  <div class="hud-left">
    <div class="pill money">💰 <b id="hMoney">0 €</b> <small id="hRate"></small></div>
    <div class="pill subs">👥 <b id="hSubs">0</b> Abos</div>
  </div>
  <div class="pill portal" id="hPortal">🌀 Portal</div>
  <button class="pill menu" id="menuBtn" type="button" aria-label="Menü">☰</button>
</div>
<button id="prompt" type="button" hidden></button>
<div id="joy" aria-hidden="true"><div id="knob"></div></div>
<div id="bossHud" hidden>
  <div class="bar-row"><span>👾 Glitchgolem</span><div class="bar bar-boss"><i></i></div><span class="boss-hp"></span></div>
  <div class="bar-row"><span>❤️ Du</span><div class="bar bar-me"><i></i></div><span class="me-hp"></span></div>
</div>
<div id="hurt" aria-hidden="true"></div>
<div id="fps" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="panels"></div>
<div id="start" hidden></div>
<div id="loading" hidden><div class="load-box"><div class="load-spin" aria-hidden="true">🌀</div><p>Reise nach <b></b> …</p></div></div>
<noscript><p style="padding:16px">Kanalbucht braucht JavaScript und WebGL.</p></noscript>
<script type="module" src="js3d/main.js"></script>
</body>
</html>
